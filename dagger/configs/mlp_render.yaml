mode: mlp_render
seed: 20261024
device: cuda:0
run_root: ${oc.env:SONIC_RUNS_ROOT,/home/helloworld/bly/runs}
sonic_repo_root: ${oc.env:SONIC_REPO_ROOT,/home/helloworld/bly/sonic-repro/GR00T-WholeBodyControl}
teacher_checkpoint: ${oc.env:SONIC_TEACHER_CHECKPOINT}

dagger:
  num_envs: 1
  action_clip_value: 20.0
  render_policy: ${oc.env:DAGGER_RENDER_POLICY,mlp}
  render_steps: ${oc.env:DAGGER_RENDER_STEPS,192}
  motion_file: ${oc.env:DAGGER_MOTION_FILE}
  motion_key: ${oc.env:DAGGER_RENDER_MOTION_KEY,}
  motion_keys: []
  motion_count: 1
  motion_seed: 20261024
  max_unique_motions: 1
  sample_unique_motions: true
  observation_corruption: false
  events: tracking/level0_4
  terminations: tracking/base_adaptive_strict_ori_foot_xyz
  smpl_motion_file: zeros
  render_latent_mode: ${oc.env:DAGGER_RENDER_LATENT_MODE,fixed_standard_normal}
  render_disable_tracking_terminations: ${oc.env:DAGGER_RENDER_KEEP_RUNNING,true}
  disable_motion_augmentation: ${oc.env:DAGGER_RENDER_DISABLE_MOTION_AUG,false}
  # Only used when render_policy=cvae gets a pre-DAgger C checkpoint (DAgger checkpoints carry their own).
  render_c_future_reference: ${oc.env:DAGGER_RENDER_C_FUTURE_REFERENCE,true}
  render_c_execute_steps: ${oc.env:DAGGER_RENDER_C_EXECUTE_STEPS,4}

student:
  checkpoint: ${oc.env:DAGGER_RENDER_CHECKPOINT,}
  cvae_root: ${oc.env:STATE_ACTION_CVAE_ROOT,/home/helloworld/bly/state-action-cvae}
  model_config: ${oc.env:CVAE_MODEL_CONFIG,/home/helloworld/bly/state-action-cvae/configs/posterior_hierarchical_standard_cvae_long_horizon_fp32.json}
  normalization_run: ${oc.env:CVAE_KL2_DATASET_RUN,}
  hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
  micro_batch: 1
  freeze_normalization: true
