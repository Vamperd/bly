mode: sonic_causal_8h
seed: 20261105
device: cuda:0
run_root: ${oc.env:SONIC_RUNS_ROOT,/home/helloworld/bly/runs}
sonic_repo_root: ${oc.env:SONIC_REPO_ROOT,/home/helloworld/bly/sonic-repro/GR00T-WholeBodyControl}
teacher_checkpoint: ${oc.env:SONIC_TEACHER_CHECKPOINT}

# rounds is an upper bound; the run stops before a round that would exceed max_train_hours.
dagger:
  beta_schedule: [1.0, 0.8, 0.6, 0.4, 0.2, 0.0]
  rounds: 80
  max_train_hours: ${oc.env:DAGGER_MAX_HOURS,8.0}
  rollout_steps: 1000
  eval_steps: 192
  num_envs: 8
  motion_file: ${oc.env:DAGGER_MOTION_FILE}
  motion_keys: []
  motion_count: 8
  motion_seed: 20261104
  max_unique_motions: 8
  sample_unique_motions: true
  observation_corruption: false
  events: tracking/level0_4
  terminations: tracking/base_adaptive_strict_ori_foot_xyz
  smpl_motion_file: zeros

student:
  checkpoint: ${oc.env:SONIC_CAUSAL_STUDENT_CHECKPOINT}
  normalization_run: ${oc.env:SONIC_CAUSAL_DATASET_RUN,/home/helloworld/bly/runs/cvae_physics_dataset_v5}
  source_dataset_run: ${oc.env:SONIC_CAUSAL_DATASET_RUN,/home/helloworld/bly/runs/cvae_physics_dataset_v5}
  source_max_samples: null
  source_mix: 0.5
  train_steps_per_round: 4000
  micro_batch: 32
  learning_rate: 1.0e-5
  weight_decay: 0.0
  action_clip_value: 20.0
  kl_beta: 0.002
