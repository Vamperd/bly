[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-state-action-cvae"
version = "0.1.0"
description = "Masked CVAE baselines for SONIC state-action dynamics"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26,<3",
  "torch>=2.4",
]

[project.scripts]
state-action-cvae = "cvae_sa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

